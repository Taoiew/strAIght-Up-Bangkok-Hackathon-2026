services:
  postgres:
    image: postgres:16-alpine
    container_name: hackathon_starter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: hackathon
      POSTGRES_DB: hackathon_starter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon -d hackathon_starter"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
